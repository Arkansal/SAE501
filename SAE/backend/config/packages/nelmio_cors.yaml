nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin:
            - '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
            - "http://localhost:5173"
            - "http://127.0.0.1:5173"
        allow_methods: ["GET", "OPTIONS", "POST", "PUT", "PATCH", "DELETE"]
        allow_headers: ["Content-Type", "Authorization"]
        expose_headers: ["Link"]
        max_age: 3600
    paths:
        "^/":
            allow_origin:
                - '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
                - "http://localhost:5173"
                - "http://127.0.0.1:5173"
            allow_headers: ["*"]
            allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            max_age: 3600
