<!DOCTYPE html>
<html>

<head>
    <title>Scanner AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true; alpha: true; colorManagement: true;" vr-mode-ui="enabled: false">

        <a-marker preset="hiro">

            <a-entity rotation="-90 0 0">

                <a-entity position="0 0 0" scale="0.005 0.005 0.005" gltf-model="../src/assets/3d_model/scene.gltf"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
                </a-entity>

            </a-entity>

            <a-entity light="type: ambient; intensity: 1;"></a-entity>
            <a-entity light="type: directional; intensity: 1.5; castShadow: true;" position="1 1 1"></a-entity>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
